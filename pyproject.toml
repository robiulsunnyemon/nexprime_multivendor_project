[project]
name = "nexprime"
version = "0.1.0"
description = "A multivendor project"
authors = [
    {name = "robiulsunnyemon",email = "robiulsunyemon@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard] (>=0.129.0,<0.130.0)",
    "prisma (>=0.15.0,<0.16.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "cloudinary (>=1.44.1,<2.0.0)",
    "stripe (>=14.4.0,<15.0.0)",
    "livekit-api (>=1.1.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false
